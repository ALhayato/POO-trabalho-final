name: primeiro-workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v5

    - name: Mensagem de Início
      run: echo "🚀 Iniciando o processo de build do projeto Java..."
    - name: Listar arquivos na raiz (pós-checkout)
      run: ls -la
    - name: Configurar JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Compilar com javac
      run: |
        echo "Compilando arquivos .java..."
        # Cria uma pasta para os arquivos compilados (.class)
        mkdir -p bin
        # Encontra e compila todos os arquivos .java do projeto
        find src -name "*.java" > sources.txt
        javac -d bin @sources.txt

    - name: Executar a aplicação
      run: |
        echo "Executando o programa..."
        java -cp bin com.exemplo.Main
